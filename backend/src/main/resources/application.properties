server.port=${PORT:8080}
spring.application.name=expense-tracker
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expense_tracker}
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration: Comma-separated list of allowed origin patterns (supports wildcards like https://*.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.netlify.app}
