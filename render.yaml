services:
  - type: web
    name: expense-tracker-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
        # Enter your MongoDB Atlas connection string here in Render Dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.netlify.app"
